name: roundcut

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/roundcut
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Scheduled jobs (ROUND-04 reminders): calls the web app's cron route every
  # 15 minutes with CRON_SECRET from apps/web/.env.
  cron:
    image: curlimages/curl:8.17.0
    init: true
    env_file:
      - path: apps/web/.env
        required: false
    entrypoint:
      [
        "sh",
        "-c",
        'while true; do curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://web:3001/api/cron/reminders || echo "cron: reminders call failed"; echo; sleep 900; done',
      ]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: roundcut-postgres
    environment:
      POSTGRES_DB: roundcut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - roundcut_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # S3-compatible stand-in for Cloudflare R2 in development (VER-01).
  # pgsty/minio is the maintained community build: MinIO no longer publishes
  # images. Console on http://localhost:9001 (roundcut / roundcut-dev-secret).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: roundcut-minio
    command: ["minio", "server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: roundcut
      MINIO_ROOT_PASSWORD: roundcut-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - roundcut_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the bucket once MinIO is up; R2 buckets are created in the
  # Cloudflare dashboard (jurisdiction eu).
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "sh",
        "-c",
        "mc alias set local http://minio:9000 roundcut roundcut-dev-secret && mc mb --ignore-existing local/roundcut",
      ]
    restart: "no"

volumes:
  roundcut_postgres_data:
  roundcut_minio_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
